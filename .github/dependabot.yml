# Keeps the SHA-pinned actions and the digest-pinned base images current.
# Cargo dependencies are not listed: every merge to main is released, so those
# are updated deliberately (RustSec advisories are reported by CI).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(container)"
