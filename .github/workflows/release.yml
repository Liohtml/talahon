name: Release

# Every push to main that passes CI and changes a published crate is released:
# next version (Conventional Commits), `chore(release)` commit + `vX.Y.Z` tag on
# main, a GitHub release, and every `talahon-*` crate on crates.io.
# See scripts/release.py and CONTRIBUTING.md ("Releases").

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Finish an interrupted release (rate limit, missing token) or release by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: version / tag / publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check that main is still the commit CI tested
        id: guard
        run: |
          # publish stops waiting for crates.io's new-crate rate limit after this,
          # well before the job's timeout.
          echo "RELEASE_DEADLINE=$(( $(date +%s) + 220 * 60 ))" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::main has moved past $HEAD_SHA; the CI run of the newer commit releases it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.skip == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.skip == 'false'
        with:
          save-if: false

      - name: Version, changelog, commit and tag
        id: bump
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py bump --notes "$RUNNER_TEMP/notes.md"

      - name: Verify the crates package and build on their own
        if: steps.bump.outputs.created == 'true'
        run: cargo package --workspace --locked

      - name: Push the release commit and tag
        id: push
        if: steps.bump.outputs.created == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git push --atomic origin HEAD:main "refs/tags/$TAG"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]; then
            echo "::notice::main moved on while releasing; the CI run of the newer commit releases it"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      - name: GitHub release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "Talon $TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish to crates.io
        # Also runs when nothing new was tagged: finishes an interrupted publish.
        if: >-
          steps.guard.outputs.skip == 'false' &&
          (steps.bump.outputs.created != 'true' || steps.push.outputs.pushed == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release.py publish
