[package]
name = "talahon"
description = "Talahon — automated AI SOC analyst (host orchestrator)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
default-run = "talahon"

[lib]
name = "talon"
path = "src/lib.rs"

[[bin]]
name = "talahon"
path = "src/main.rs"

# The name of the binary up to 2.x: same code, prints a deprecation notice.
# Removed in the next major version.
[[bin]]
name = "talon"
path = "src/bin/talon.rs"

[dependencies]
talon-core = { workspace = true }
talon-db = { workspace = true }
talon-llm = { workspace = true }
talon-security = { workspace = true }
talon-container = { workspace = true }
talon-scheduler = { workspace = true }
talon-ipc = { workspace = true }
talon-router = { workspace = true }
talon-channels = { workspace = true }
talon-http = { workspace = true }
talon-intel = { workspace = true }
talon-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
# `talahon eval run`: client of the CoPilot HTTP API.
reqwest = { workspace = true }
# Descriptor-relative, symlink-safe reads of agent-written files (MYTH-10).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
# Tampering with the audit log behind talon-db's back (audit tests).
rusqlite = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
