[package]
name = "talahon-security"
description = "Security policy engine: mounts, senders, IPC authorization, prompt-injection guard, redaction, egress, auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true

[lib]
name = "talon_security"

[dependencies]
talon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
globset = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
ipnet = { workspace = true }
tokio = { workspace = true }
# O_NOFOLLOW | O_NONBLOCK opens of the group instruction files (agent-writable
# folders): no `unsafe`, no libc FFI in our code.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
