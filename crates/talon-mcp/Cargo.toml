[package]
name = "talon-mcp"
description = "Model Context Protocol (JSON-RPC 2.0 over stdio) client and server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
talon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Safe wrappers for kill(2)/killpg(2) (SIGTERM/SIGKILL of MCP server process groups).
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
