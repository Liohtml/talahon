[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Liohtml/talahon"
homepage = "https://github.com/Liohtml/talahon"
readme = "README.md"
authors = ["Talon contributors"]
keywords = ["soc", "security", "siem", "llm", "agent"]

[workspace.dependencies]
# --- internal crates ---
# Published on crates.io as `talahon-*` (the `talon-*` names are taken); the
# dependency keys keep the Rust crate names `talon_*`. Release automation
# (scripts/release.py) keeps `version` equal to `workspace.package.version`.
talon-core = { package = "talahon-core", path = "crates/talon-core", version = "2.0.3" }
talon-db = { package = "talahon-db", path = "crates/talon-db", version = "2.0.3" }
talon-llm = { package = "talahon-llm", path = "crates/talon-llm", version = "2.0.3" }
talon-mcp = { package = "talahon-mcp", path = "crates/talon-mcp", version = "2.0.3" }
talon-tools = { package = "talahon-tools", path = "crates/talon-tools", version = "2.0.3" }
talon-intel = { package = "talahon-intel", path = "crates/talon-intel", version = "2.0.3" }
talon-anon = { package = "talahon-anon", path = "crates/talon-anon", version = "2.0.3" }
talon-security = { package = "talahon-security", path = "crates/talon-security", version = "2.0.3" }
talon-container = { package = "talahon-container", path = "crates/talon-container", version = "2.0.3" }
talon-scheduler = { package = "talahon-scheduler", path = "crates/talon-scheduler", version = "2.0.3" }
talon-ipc = { package = "talahon-ipc", path = "crates/talon-ipc", version = "2.0.3" }
talon-router = { package = "talahon-router", path = "crates/talon-router", version = "2.0.3" }
talon-channels = { package = "talahon-channels", path = "crates/talon-channels", version = "2.0.3" }
talon-http = { package = "talahon-http", path = "crates/talon-http", version = "2.0.3" }
talon-setup = { package = "talahon-setup", path = "crates/talon-setup", version = "2.0.3" }
talon-net = { package = "talahon-net", path = "crates/talon-net", version = "2.0.3" }

# --- async runtime ---
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync", "fs"] }
futures = "0.3"
async-trait = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# --- time / scheduling ---
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "2"

# --- storage ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- networking ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors", "timeout"] }
url = "2"
bytes = "1"
http = "1"

# --- text / matching ---
regex = "1"
aho-corasick = "1"
globset = "0.4"
walkdir = "2"
ipnet = "2"

# --- crypto / ids ---
subtle = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

# --- cli ---
clap = { version = "4", features = ["derive", "env"] }

# --- testing ---
tempfile = "3"
wiremock = "0.6"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
